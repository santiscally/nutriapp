# ============================================================
# BonosApp — override OPCIONAL: nginx como front único (dueño de 80/443 y del TLS).
#
#   NGINX_CONF_DIR=./nginx/conf.d \
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.edge.yml up -d --build
#
# NO se usa en el VPS actual: ahí los 80/443 los tiene Caddy, que además emite y renueva
# los certs solo. Esto es para un host donde bonosapp sea lo único que se sirve.
#
# Requisitos extra de este modo (no aplican detrás de Caddy):
#   - NGINX_CONF_DIR=./nginx/conf.d  → la variante con TLS + redirect 80→443 + webroot ACME.
#   - Certificados reales en nginx/certs/ (fullchain.pem + privkey.pem). nginx NO arranca sin
#     ellos: primero `bash scripts/gen-selfsigned-cert.sh <dominio>` como placeholder.
#   - Renovación del cert: MANUAL (copiar el par + `nginx -s reload`). Ver DEPLOY.md paso 1.
#   - Endurecer `server_name _` en nginx/conf.d/bonosapp.conf si el host sirve otros dominios.
# ============================================================

services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    # !override reemplaza la lista del override anterior en vez de fusionarla: sin esto
    # nginx seguiría atado a la red `web`, que en un host sin Caddy no existe y aborta el `up`.
    networks: !override [bonosapp-net]

name: bonosapp

# Stack de desarrollo. Una sola Postgres con dos DBs adentro (bonosapp + keycloak).
# Puertos bindeados a 127.0.0.1 para no exponerlos fuera del host.
# Prod (Fase 3): docker-compose.prod.yml agrega nginx TLS y Keycloak en modo produccion.

services:
  db:
    image: postgres:16-alpine
    container_name: bonosapp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bonosapp}
      POSTGRES_USER: ${POSTGRES_USER:-bonosapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bonosapp_dev}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - bonosapp_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bonosapp}"]
      interval: 5s
      retries: 10
    networks: [bonosapp-net]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: bonosapp-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-bonosapp}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-bonosapp_dev}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    networks: [bonosapp-net]

  backend:
    build:
      context: ./backend
    image: bonosapp/backend:dev
    container_name: bonosapp-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-bonosapp}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bonosapp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bonosapp_dev}
      # En dev NO validamos iss (mismatch localhost:8081 vs keycloak:8080 interno).
      # Spring valida firma via JWK; alcanza para dev local. Prod si setea issuer-uri.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/bonosapp/protocol/openid-connect/certs}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      # --- Keycloak Admin API (registro/aprobación de nutricionistas) ---
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-bonosapp}
      # Admin API por service-account (client_credentials) del client confidencial bonosapp-backend.
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-bonosapp-backend}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-bonosapp-backend-dev-secret-change-me}
      KEYCLOAK_PUBLIC_CLIENT_ID: ${KEYCLOAK_PUBLIC_CLIENT_ID:-bonosapp-frontend}
      # --- Integraciones (stub|live) ---
      CONTABILIUM_MODE: ${CONTABILIUM_MODE:-stub}
      CONTABILIUM_CLIENT_ID: ${CONTABILIUM_CLIENT_ID:-}
      CONTABILIUM_CLIENT_SECRET: ${CONTABILIUM_CLIENT_SECRET:-}
      CONTABILIUM_BASE_URL: ${CONTABILIUM_BASE_URL:-https://rest.contabilium.com}
      # --- Catálogo recetable (ver .env.example: ojo con Combo) ---
      CATALOGO_RUBROS_PERMITIDOS: ${CATALOGO_RUBROS_PERMITIDOS:-144331}
      CATALOGO_TIPOS_ERP: ${CATALOGO_TIPOS_ERP:-Producto,Combo}
      CATALOGO_PRECIO_MINIMO: ${CATALOGO_PRECIO_MINIMO:-100}
      TIENDANUBE_MODE: ${TIENDANUBE_MODE:-stub}
      TIENDANUBE_BASE_URL: ${TIENDANUBE_BASE_URL:-https://api.tiendanube.com/2025-03}
      TIENDANUBE_STORE_ID: ${TIENDANUBE_STORE_ID:-}
      TIENDANUBE_STORE_URL: ${TIENDANUBE_STORE_URL:-}
      TIENDANUBE_ACCESS_TOKEN: ${TIENDANUBE_ACCESS_TOKEN:-}
      TIENDANUBE_CLIENT_ID: ${TIENDANUBE_CLIENT_ID:-}
      TIENDANUBE_CLIENT_SECRET: ${TIENDANUBE_CLIENT_SECRET:-}
      TIENDANUBE_WEBHOOK_SECRET: ${TIENDANUBE_WEBHOOK_SECRET:-dev-webhook-secret}
      TIENDANUBE_USER_AGENT: ${TIENDANUBE_USER_AGENT:-BonosApp (contacto.simpleapps@gmail.com)}
      MAIL_MODE: ${MAIL_MODE:-stub}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@bonosapp.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-BonosApp}
      # Casilla que recibe el aviso de cada registro nuevo + URL para los links de los mails.
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    networks: [bonosapp-net]

  # frontend: lo scaffoldea Fran (Fase 0, tarea F.1). Descomentar cuando exista
  # frontend/Dockerfile. Mientras tanto: docker compose up -d db keycloak backend
  # (o `up -d` a secas, que solo falla en este servicio) + `npm run dev` local.
  # frontend:
  #   build:
  #     context: ./frontend
  #     args:
  #       VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
  #       VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8081}
  #       VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-bonosapp}
  #       VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-bonosapp-frontend}
  #   image: bonosapp/frontend:dev
  #   container_name: bonosapp-frontend
  #   restart: unless-stopped
  #   depends_on: [backend]
  #   ports:
  #     - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
  #   networks: [bonosapp-net]

  # Catcher SMTP para desarrollo: se queda con TODO lo que se manda y lo muestra en una webmail
  # (http://localhost:8025). Permite ejercitar el envío de verdad —no el stub— sin depender del
  # proveedor del cliente ni mandarle un mail a nadie.
  #
  # Va detrás de un profile a propósito: `docker compose up -d` NO lo levanta, y prod (que se arma
  # como override de este archivo) tampoco. Un catcher suelto en prod se tragaría los mails reales.
  #   docker compose --profile mail up -d
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: bonosapp-mailpit
    profiles: [mail]
    restart: unless-stopped
    # Acepta cualquier credencial y permite AUTH sin TLS. Así el backend usa la MISMA config que
    # con un proveedor real (auth encendida) y no un camino especial que en prod no se ejercita.
    command: ["--smtp-auth-accept-any", "--smtp-auth-allow-insecure"]
    # Sólo se publica la webmail. El 1025 (SMTP) no se bindea: el backend le habla por el nombre
    # de servicio dentro de bonosapp-net, y así no pelea con el Mailpit de otro proyecto.
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks: [bonosapp-net]

volumes:
  bonosapp_db_data:

networks:
  bonosapp-net:
    driver: bridge

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid #e6e6df">
  <div style="max-width:1280px;margin:0 auto;padding:10px 20px;min-height:72px;display:flex;align-items:center;gap:20px;flex-wrap:wrap">
    <a href="Dashboard.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#16302c;flex:none">
      <span style="width:34px;height:34px;border-radius:11px;background:#e4f3ec;display:grid;place-items:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f8a66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6"></path></svg>
      </span>
      <span style="font-size:19px;font-weight:700;letter-spacing:-0.01em">NutriApp</span>
    </a>
    <nav style="display:flex;align-items:center;gap:4px;flex:1 0 auto">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
        <a href="{{ l.href }}" style="{{ l.style }}">{{ l.label }}</a>
      </sc-for>
    </nav>
    <div style="display:flex;align-items:center;gap:14px;flex:none">
      <a href="EmitirReceta.dc.html" style="display:inline-flex;align-items:center;gap:8px;background:#0f8a66;color:#fff;text-decoration:none;font-weight:700;font-size:14.5px;padding:11px 18px;border-radius:11px;box-shadow:0 2px 8px rgba(15,138,102,.24)" style-hover="background:#0b6e51">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Nueva receta
      </a>
      <div style="width:1px;height:32px;background:#e6e6df"></div>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="width:36px;height:36px;border-radius:50%;background:#e4f3ec;color:#0b6e51;display:grid;place-items:center;font-size:13px;font-weight:700">{{ initials }}</span>
        <span style="display:flex;flex-direction:column;line-height:1.25;min-width:0">
          <span style="font-size:14px;font-weight:700;color:#16302c">{{ userName }}</span>
          <span style="font-size:11.5px;color:#8b9793">Nutricionista · MN 12.483</span>
        </span>
      </div>
      <a href="Login.dc.html" title="Salir" style="width:36px;height:36px;border-radius:10px;border:1px solid #e6e6df;display:grid;place-items:center;color:#6c7b78;text-decoration:none" style-hover="background:#f4f6f3;color:#16302c">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      </a>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:72},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;recetas&quot;,&quot;pacientes&quot;,&quot;cierre&quot;],&quot;default&quot;:&quot;dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Lucía Méndez&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;initials&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;LM&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const ITEMS = [
  { key: "dashboard", label: "Panel", href: "Dashboard.dc.html" },
  { key: "recetas", label: "Recetas", href: "Recetas.dc.html" },
  { key: "pacientes", label: "Pacientes", href: "Pacientes.dc.html" },
  { key: "cierre", label: "Cierre mensual", href: "CierreMensual.dc.html" },
];
const BASE = "text-decoration:none;font-size:15px;padding:9px 15px;border-radius:10px;white-space:nowrap;transition:background .15s ease,color .15s ease;";
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? "dashboard";
    return {
      initials: this.props.initials ?? "LM",
      userName: this.props.userName ?? "Lucía Méndez",
      links: ITEMS.map((i) => ({
        ...i,
        style: i.key === active
          ? BASE + "background:#eef2ee;color:#16302c;font-weight:700"
          : BASE + "color:#6c7b78;font-weight:600",
      })),
    };
  }
}
</script>
</body>
</html>

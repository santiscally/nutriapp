spring:
  application:
    name: nutriapp-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: ${TZ:America/Argentina/Buenos_Aires}
    default-property-inclusion: non_null
  servlet:
    multipart:
      # El default de Spring Boot es 1 MB y el maestro de artículos pesa ~1,5 MB: con el default,
      # el import de C-12 fallaría siempre. El tope real de negocio lo pone nutriapp.catalogo.import-max-bytes
      # (mensaje de error claro); esto es solo el límite del contenedor.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:25MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:30MB}
  mail:
    # SMTP del proveedor de mail (Fase 2). Con MAIL_SMTP_HOST vacio no se autoconfigura.
    host: ${MAIL_SMTP_HOST:}
    port: ${MAIL_SMTP_PORT:587}
    username: ${MAIL_SMTP_USERNAME:}
    password: ${MAIL_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          # Ambas en true para cualquier proveedor real. Se apagan sólo contra un catcher SMTP
          # local (Mailpit), que no tiene ni auth ni TLS. El default seguro es el de producción.
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
            required: ${MAIL_SMTP_STARTTLS:true}
        transport:
          protocol: smtp
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nutriapp}
    username: ${SPRING_DATASOURCE_USERNAME:nutriapp}
    password: ${SPRING_DATASOURCE_PASSWORD:nutriapp_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: ${TZ:America/Argentina/Buenos_Aires}
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # En dev no validamos `iss`: el browser pide tokens a localhost:8081 mientras
          # el backend ve Keycloak por la red interna como http://keycloak:8080.
          # Spring valida firma via JWK; alcanza para dev. Prod setea issuer al dominio.
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8081/realms/nutriapp/protocol/openid-connect/certs}

server:
  port: 8080
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    # El adapter de mail es stub hasta Fase 2 (sin SMTP real): sin esto el health
    # indicator intenta conectar al SMTP vacío y marca /actuator/health como DOWN.
    mail:
      enabled: false

app:
  cors:
    # 5173 es el default de Vite; 5174 es el fallback cuando el 5173 está ocupado por otro proyecto
    # (en la máquina de Santi lo toma imedba). En prod esto se setea por env y queda solo el dominio real.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

nutriapp:
  catalogo:
    # Qué entra al catálogo recetable (mail de Gon 2026-08-03 + C-13/C-14).
    # rubros-permitidos: IdRubro de Contabilium que cuentan como "producto terminado". Hoy tenemos
    #   uno solo; Gon quedó en pasar la lista completa (call 34:26). Vacío = sin filtro de rubro.
    rubros-permitidos: ${CATALOGO_RUBROS_PERMITIDOS:144331}
    # Tipos del ERP que se recetean. El mail de Gon dice "solo quedarnos con Producto", pero ese campo
    # tiene TRES valores en la cuenta de TBC —Producto (2004), Combo (209) y Servicio (54)— y los Combo
    # son los packs x2/x3 y los exhibidores de la línea ON-ROLL propia. Su intención era sacar los
    # servicios, no los packs, así que van los dos: se venden en TiendaNube como cualquier artículo y el
    # cupón les aplica igual. **A confirmar con Gon**; para volver a su instrucción literal alcanza con
    # CATALOGO_TIPOS_ERP=Producto (el catálogo recetable pasa de 702 a 496). Vacío = sin filtro.
    tipos-erp-permitidos: ${CATALOGO_TIPOS_ERP:Producto,Combo}
    # Umbral de precio irrisorio: tienen ~1000 artículos cargados a $1 (call 44:52).
    precio-minimo: ${CATALOGO_PRECIO_MINIMO:100}
    # Tope del Excel maestro que sube el admin (el real pesa ~1,5 MB).
    import-max-bytes: ${CATALOGO_IMPORT_MAX_BYTES:20971520}
  nutricionistas:
    # Porcentajes con los que nace una nutricionista al registrarse. NO es una configuración global
    # de negocio (V011 la eliminó): es sólo el punto de partida, porque el registro es público y
    # nadie elige ahí su propio descuento. El admin los ajusta al aprobarla y desde entonces manda
    # el valor de su ficha.
    descuento-pct-default: ${NUTRICIONISTA_DESCUENTO_PCT_DEFAULT:15.00}
    comision-pct-default: ${NUTRICIONISTA_COMISION_PCT_DEFAULT:10.00}
  recetas:
    vigencia-dias: ${RECETA_VIGENCIA_DIAS:30}
    # Los % de descuento y comisión no viven acá: son de cada nutricionista (ver arriba).
    max-items: ${RECETA_MAX_ITEMS:10}
    # Cron del job de vencimiento (diario 03:00 AR). Catch-up adicional al arrancar.
    vencimiento-cron: ${RECETA_VENCIMIENTO_CRON:0 0 3 * * *}
  cupones:
    # Resync de cupones pendientes de sync (2.8). En stub es no-op (todo sigue PENDIENTE);
    # al pasar TiendaNube a live drena lo acumulado. Reintento cada 5 min por defecto.
    sync-interval-ms: ${CUPON_SYNC_INTERVAL_MS:300000}
  notificaciones:
    # Poller que drena la cola. En stub degrada y la notificación sigue QUEUED.
    dispatch-interval-ms: ${NOTIF_DISPATCH_INTERVAL_MS:30000}
    max-intentos: ${NOTIF_MAX_INTENTOS:5}
    batch-size: ${NOTIF_BATCH_SIZE:25}
    # Casilla que recibe el aviso de cada solicitud de registro nueva. Vacía = nadie se entera
    # (queda un warn en el log) y hay que mirar la tabla nutricionistas a mano.
    admin-email: ${ADMIN_NOTIFICATION_EMAIL:}
    # URL pública desde la que se arman los links de los mails (login, bandeja del admin).
    app-url: ${APP_PUBLIC_URL:http://localhost:5173}
  webhooks:
    # Processor que drena webhook_events sin procesar (lee la orden y aplica la conversión).
    process-interval-ms: ${WEBHOOK_PROCESS_INTERVAL_MS:20000}
    batch-size: ${WEBHOOK_BATCH_SIZE:25}
    # Polling de respaldo de órdenes pagadas (en stub no-op). Ventana en horas hacia atrás.
    polling-interval-ms: ${WEBHOOK_POLLING_INTERVAL_MS:300000}
    polling-window-hours: ${WEBHOOK_POLLING_WINDOW_HOURS:24}
  rate-limit:
    # Límite por IP en los endpoints públicos (mitiga abuso/hammering de /registro contra Keycloak y
    # del webhook público). En memoria, single-instance; si se escala, mover a un store compartido.
    enabled: ${RATE_LIMIT_ENABLED:true}
    evict-interval-ms: ${RATE_LIMIT_EVICT_INTERVAL_MS:600000}
    registro:
      capacity: ${RATE_LIMIT_REGISTRO_CAPACITY:10}
      window-seconds: ${RATE_LIMIT_REGISTRO_WINDOW_SECONDS:60}
    webhooks:
      capacity: ${RATE_LIMIT_WEBHOOKS_CAPACITY:120}
      window-seconds: ${RATE_LIMIT_WEBHOOKS_WINDOW_SECONDS:60}
  keycloak:
    # Admin REST API: crear usuarios al registrar y habilitarlos al aprobar.
    # En Docker el backend ve Keycloak por la red interna (http://keycloak:8080).
    # Auth por service-account (client_credentials) del client confidencial nutriapp-backend,
    # scopeado sólo a realm-management manage-users/view-users (hardening Fase 3): NO el master.
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8081}
    realm: ${KEYCLOAK_REALM:nutriapp}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:nutriapp-backend}
    # Dev: el secret del realm importado. Prod: regenerar el secret del client y setear el env
    # (application-prod.yml lo deja vacío → fail-closed si no se configura).
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:nutriapp-backend-dev-secret-change-me}
    nutricionista-role: ${KEYCLOAK_NUTRICIONISTA_ROLE:NUTRICIONISTA}
    # Client publico del front. Solo se usa para verificar la contrasena actual (ROPC) cuando
    # alguien la cambia desde su perfil: la Admin API no expone un "validar credencial".
    public-client-id: ${KEYCLOAK_PUBLIC_CLIENT_ID:nutriapp-frontend}
  integrations:
    contabilium:
      mode: ${CONTABILIUM_MODE:stub}
      base-url: ${CONTABILIUM_BASE_URL:https://rest.contabilium.com}
      client-id: ${CONTABILIUM_CLIENT_ID:}
      client-secret: ${CONTABILIUM_CLIENT_SECRET:}
    tiendanube:
      mode: ${TIENDANUBE_MODE:stub}
      base-url: ${TIENDANUBE_BASE_URL:https://api.tiendanube.com/2025-03}
      store-id: ${TIENDANUBE_STORE_ID:}
      # Vitrina pública de la tienda; va en el mail y en el WhatsApp del bono. Vacía = sin link.
      store-url: ${TIENDANUBE_STORE_URL:}
      access-token: ${TIENDANUBE_ACCESS_TOKEN:}
      client-id: ${TIENDANUBE_CLIENT_ID:}
      client-secret: ${TIENDANUBE_CLIENT_SECRET:}
      user-agent: ${TIENDANUBE_USER_AGENT:BonosApp (contacto.simpleapps@gmail.com)}
      # Secreto para verificar el HMAC de los webhooks. En live = client_secret de la app TiendaNube.
      # Default de dev conocido para poder firmar el webhook en los smoke tests. En prod: env obligatorio
      # (application-prod.yml lo deja vacío → fail-closed si no se setea).
      webhook-secret: ${TIENDANUBE_WEBHOOK_SECRET:dev-webhook-secret}
    mail:
      mode: ${MAIL_MODE:stub}
      # Remitente del SmtpMailSender (Fase 2). El SMTP en sí va en spring.mail.* (arriba).
      from-address: ${MAIL_FROM_ADDRESS:no-reply@nutriapp.local}
      from-name: ${MAIL_FROM_NAME:BonosApp}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

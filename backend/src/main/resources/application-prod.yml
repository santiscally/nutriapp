spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}

server:
  # No filtrar mensajes de excepción crudos al cliente por el /error por defecto de Spring Boot
  # (lo que escapa al GlobalExceptionHandler). Los ApiError propios siguen con su mensaje.
  error:
    include-message: never
    include-binding-errors: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

bonosapp:
  keycloak:
    # Sin default en prod: hay que regenerar el secret del client bonosapp-backend y setear el env.
    # Vacío → el service-account no obtiene token y las ops de admin fallan 503 (fail-closed), nunca
    # cae al secret de dev. NUNCA reusar el placeholder `*-dev-secret-change-me` en prod.
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
  integrations:
    tiendanube:
      # Sin default de dev en prod: si no se setea el env, el HMAC no verifica y el webhook
      # responde 401 (fail-closed). En live este valor = client_secret de la app TiendaNube.
      webhook-secret: ${TIENDANUBE_WEBHOOK_SECRET:}

logging:
  level:
    com.bonosapp: INFO

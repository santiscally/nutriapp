# ============================================================
# NutriApp — reverse proxy + TLS termination (prod)
# Se monta en /etc/nginx/conf.d/ del contenedor nginx (incluido dentro de http{}).
# Topología (single domain, path-based):
#   /        -> SPA estática (frontend/dist, bind-mount read-only)
#   /api/    -> backend Spring Boot  (contexto real /api/v1/...)
#   /auth/   -> Keycloak            (KC_HTTP_RELATIVE_PATH=/auth)
# server_name _ : sirve para cualquier Host → portable a cualquier dominio sin editar
# este archivo. El dominio real solo importa para el CN del certificado y HSTS.
# (Al fijar el dominio, se puede endurecer a `server_name <dominio>;` + un bloque
#  catch-all que descarte Hosts desconocidos con `return 444;`.)
# ============================================================

# No filtrar la versión de nginx en el header Server ni en las páginas de error.
server_tokens off;

# Rate limit de red (red de seguridad gruesa; el rate-limit de negocio por endpoint
# lo hace la app en /api/v1/registro y /webhooks). Zona por IP.
limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
limit_req_status 429;

upstream nutriapp_backend {
    server backend:8080;
    keepalive 16;
}

upstream nutriapp_keycloak {
    server keycloak:8080;
    keepalive 16;
}

# --- HTTP :80 → redirect a HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME http-01 (Let's Encrypt): tiene que servirse por HTTP sin redirigir, o certbot
    # no puede validar el dominio. `^~` gana sobre el prefijo `/` de abajo.
    # El webroot se monta desde ./nginx/acme (ver docker-compose.prod.yml) y certbot escribe ahí:
    #   certbot certonly --webroot -w <repo>/nginx/acme -d nutriappok.com.ar -d www.nutriappok.com.ar
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Certificados (bring-your-own): montar fullchain.pem + privkey.pem en /etc/nginx/certs.
    # En dev/staging: scripts/gen-selfsigned-cert.sh genera un placeholder self-signed.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Security headers (port del patrón imedba) ---
    # HSTS: seguro sólo con un cert válido (no self-signed). Con placeholder self-signed
    # el navegador igual bloquea; con cert real fuerza HTTPS. 2 años + preload-ready.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP para una SPA que pega same-origin a /api y /auth. Los orígenes de Google Fonts
    # están permitidos porque frontend/index.html carga "Comic Neue" desde ahí (si en algún
    # momento se auto-hostea la fuente, sacar fonts.googleapis.com/gstatic.com y quedará más estricta).
    # OJO: mantener script-src SIN 'unsafe-inline'/'unsafe-eval' — los tokens viven en localStorage,
    # así que un script-src estricto es la principal defensa contra robo de token vía XSS.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; script-src 'self'; connect-src 'self'; font-src 'self' data: https://fonts.gstatic.com https://cdn.fontshare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Subidas / payloads: acotado (el webhook de TiendaNube es chico; recetas también).
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Keycloak: NO exponer la admin console ni el realm master ---
    # La app usa la Admin REST API server-side por la red interna (KEYCLOAK_BASE_URL interno),
    # nunca por el nginx público. Sólo /auth/realms/nutriapp/... (token, certs) necesita ser público.
    # Este bloque regex tiene prioridad sobre el prefijo `location /auth/`.
    location ~ ^/auth/(admin|realms/master) {
        return 404;
    }

    # --- Health check público (sólo el path exacto; el resto de /actuator NO se expone) ---
    # En prod el actuator sólo publica `health` sin detalles → seguro para monitoreo externo.
    location = /actuator/health {
        limit_req zone=perip burst=40 nodelay;
        proxy_pass http://nutriapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # XFF sobrescrito (no $proxy_add_x_forwarded_for): nginx es el único hop, así el
        # cliente no puede inyectar un XFF falso. La app confía en el primer hop de XFF.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    # --- Backend REST ---
    location /api/ {
        limit_req zone=perip burst=40 nodelay;
        proxy_pass http://nutriapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Sobrescribir (no append): evita spoofing de X-Forwarded-For contra el rate-limiter
        # por-IP de la app, que toma el primer valor de XFF como IP del cliente.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # --- Keycloak (OIDC/OAuth2; el SPA hace login ROPC contra /auth) ---
    location /auth/ {
        limit_req zone=perip burst=40 nodelay;
        proxy_pass http://nutriapp_keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # --- SPA estática (fallback a index.html para el router del cliente) ---
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

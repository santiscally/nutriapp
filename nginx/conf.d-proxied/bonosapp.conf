# ============================================================
# BonosApp — reverse proxy DETRÁS de un proxy que ya termina TLS (Caddy).
# Variante de nginx/conf.d/bonosapp.conf para el caso en que los 80/443 del host
# NO son nuestros. Se selecciona con NGINX_CONF_DIR=./nginx/conf.d-proxied (default
# en docker-compose.prod.yml). Ver DEPLOY.md → "Detrás del Caddy del VPS".
#
# Diferencias contra la variante TLS (conf.d/bonosapp.conf):
#   - Un solo server{} en :80, sin ssl_* y sin el 301 → HTTPS (lo hace Caddy en su :80).
#   - Sin location de ACME: los certs los emite y renueva Caddy, no certbot.
#   - Con real_ip: sin esto todo el tráfico entra con la IP del contenedor de Caddy.
#   - server_name fijo + catch-all que descarta Hosts desconocidos.
#
# Topología (idéntica a la otra variante):
#   /        -> SPA estática (frontend/dist, bind-mount read-only)
#   /api/    -> backend Spring Boot  (contexto real /api/v1/...)
#   /auth/   -> Keycloak            (KC_HTTP_RELATIVE_PATH=/auth)
# ============================================================

server_tokens off;

# --- IP real del cliente -------------------------------------------------
# CRÍTICO detrás de un proxy. Sin esto $remote_addr es la IP del contenedor de
# Caddy en la red `web`, así que el limit_req de abajo (y el rate-limit por IP de
# la app en /api/v1/registro, que lee X-Forwarded-For) contarían TODO el tráfico
# de internet como una sola IP: el limitador se vuelve inútil y un solo visitante
# puede dejar afuera a los demás.
#
# Confiamos en los rangos privados de docker: nginx no publica puertos al host, así
# que el único que puede abrir una conexión es un contenedor de la red `web` (Caddy).
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header   X-Forwarded-For;
# `off` = se toma el ÚLTIMO valor de X-Forwarded-For. Caddy appendea la IP del peer
# al final de la cadena, así que el último es siempre el cliente real y un
# X-Forwarded-For inyectado por el cliente queda adelante, ignorado. No usar `on`:
# ahí nginx caminaría la cadena hacia atrás y sí tomaría el valor spoofeado.
real_ip_recursive off;

# Rate limit de red (red de seguridad gruesa; el rate-limit de negocio por endpoint
# lo hace la app en /api/v1/registro y /webhooks). Zona por IP — ya con la IP real.
limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
limit_req_status 429;

upstream bonosapp_backend {
    server backend:8080;
    keepalive 16;
}

upstream bonosapp_keycloak {
    server keycloak:8080;
    keepalive 16;
}

# --- Catch-all: descarta cualquier Host que no sea el nuestro ------------
# Defensa en profundidad. Al no publicar puertos ya no podemos robarle el Host a
# haltcatch.com.ar, pero esto cubre el caso de que alguien vuelva a exponer este
# nginx o que el Caddyfile mande acá un dominio equivocado. 444 = cerrar sin responder.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;
    return      444;
}

# --- BonosApp ------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name bonosapp.com.ar www.bonosapp.com.ar;

    # --- Security headers (port del patrón imedba) ---
    # Van acá y no en Caddy: Caddy no agrega ninguno de estos por su cuenta, así que
    # si no se mantienen en este server{} se pierden silenciosamente al pasar de la
    # variante TLS a esta. Viajan como headers de respuesta a través del proxy.
    # HSTS: válido porque el cliente habla HTTPS con Caddy (cert real de Let's Encrypt).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP para una SPA que pega same-origin a /api y /auth. Los orígenes de Google Fonts
    # están permitidos porque frontend/index.html carga "Comic Neue" desde ahí.
    # OJO: mantener script-src SIN 'unsafe-inline'/'unsafe-eval' — los tokens viven en
    # localStorage, así que un script-src estricto es la principal defensa contra robo
    # de token vía XSS.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; script-src 'self'; connect-src 'self'; font-src 'self' data: https://fonts.gstatic.com https://cdn.fontshare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Subidas / payloads: acotado (el adjunto de matrícula del registro es lo más pesado).
    client_max_body_size 2m;

    # Compresión: Caddy ya hace `encode zstd gzip` en el borde, pero comprimir acá
    # ahorra el tramo nginx→Caddy y Caddy respeta lo que ya viene comprimido.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Keycloak: NO exponer la admin console ni el realm master ---
    # La app usa la Admin REST API server-side por la red interna (KEYCLOAK_BASE_URL
    # interno), nunca por acá. Sólo /auth/realms/bonosapp/... (token, certs) es público.
    # Este bloque regex tiene prioridad sobre el prefijo `location /auth/`.
    location ~ ^/auth/(admin|realms/master) {
        return 404;
    }

    # --- Health check público (sólo el path exacto; el resto de /actuator NO se expone) ---
    location = /actuator/health {
        limit_req zone=perip burst=40 nodelay;
        proxy_pass http://bonosapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # XFF sobrescrito (no $proxy_add_x_forwarded_for): con real_ip resuelto arriba,
        # $remote_addr ya ES el cliente real, y así la app recibe un XFF de un solo valor
        # confiable en vez de la cadena que armó Caddy.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    # --- Backend REST ---
    location /api/ {
        limit_req zone=perip burst=40 nodelay;
        proxy_pass http://bonosapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        # Hardcodeado `https` a propósito: el sitio en Caddy sólo se sirve por HTTPS
        # (su :80 devuelve 308), así que el esquema del cliente siempre es https.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # --- Keycloak (OIDC/OAuth2; el SPA hace login ROPC contra /auth) ---
    location /auth/ {
        limit_req zone=perip burst=40 nodelay;
        proxy_pass http://bonosapp_keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        # Keycloak arma las URLs del .well-known con esto (KC_PROXY_HEADERS=xforwarded).
        # Si acá dijera `http`, el issuer saldría en http y el login del SPA rompería.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # --- SPA estática (fallback a index.html para el router del cliente) ---
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
